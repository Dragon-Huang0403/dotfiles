# Stow-managed. Contains no secrets; the keyring itself stays out of this repo.
# NOTE: ~/.gnupg must be mode 700 or gpg warns on every invocation. stow runs with
# --no-folding, so it creates the directory at umask perms: chmod 700 ~/.gnupg once.

# Provided by pinentry_mac in nix-darwin/modules/shared/apps.nix.
pinentry-program /run/current-system/sw/bin/pinentry-mac

# Cache the passphrase for a working day (8h), hard cap at 24h.
default-cache-ttl 28800
max-cache-ttl 86400
